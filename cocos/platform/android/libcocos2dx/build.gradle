apply plugin: "com.android.library"

android {
    namespace = "org.cocos2dx.lib"

    compileSdk = 36
    buildToolsVersion('36.1.0')

    // https://github.com/android/ndk/wiki/Changelog-r28
    ndkVersion = "28.2.13676358"

    project.logger.lifecycle("[cocos2d-x] A lifecycle info log message.")

    defaultConfig {
        targetSdk = 36
        minSdk = 21
        versionCode = 31704
        versionName = "3.17"
    }

    sourceSets {
        main {
            // TODO: these should use a common variable instead of dupe root paths? @deprecated
            aidl.srcDir("../java/src")
            java.srcDir("../java/src")
            manifest.srcFile("AndroidManifest.xml")
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        aidl = true
    }
}

dependencies {
    implementation(fileTree(dir: "../java/libs", include: ["*.jar"]))
    implementation("androidx.startup:startup-runtime:1.2.0")
    implementation("androidx.annotation:annotation:1.9.1")
}
